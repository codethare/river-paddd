# River compositor settings: touchpad gesture bindings and window border
# radius. Read at startup and re-read on SIGHUP (kill -HUP $(pidof river)), so
# no restart is needed after an edit.
#
# Install as $XDG_CONFIG_HOME/river/gestures.conf, usually
# ~/.config/river/gestures.conf.
# Every key is shown below with its built-in default; comment out or delete the
# ones you keep.
#
# Values are xkbcommon keysym names (case insensitive), button:<evdev code> to
# press a pointer binding, or none to unmap an entry. Malformed lines are logged
# and skipped, and a missing file leaves all defaults in place.

# When true, 3- and 4-finger gestures are consumed by the compositor even where
# nothing is bound, so they no longer reach apps. 2- and 5-finger gestures are
# always forwarded.
enabled = true

# A gesture whose accumulated delta stays under swipe_threshold on both axes is
# treated as resting fingers and fires nothing.
swipe_threshold = 10

# A pinch counts as an accumulated scale of 1 - pinch_threshold (in) or
# 1 + pinch_threshold (out); anything in between is swallowed.
pinch_threshold = 0.05

# Swipes. The direction comes from the accumulated swipe delta, honoring each
# touchpad's natural scroll setting.
3up = F1
3down = F2
3left = F3
3right = F4
4up = F5
4down = F6
4left = F7
4right = F8

# Holds: press and keep the fingers still, the binding stays pressed until they
# lift again.
hold3 = button:0x113
hold4 = F10

# Pinches: "in" is an accumulated scale <= 1 - pinch_threshold, "out" is
# >= 1 + pinch_threshold.
pinch3in = none
pinch3out = none
pinch4in = F12
pinch4out = F11

# Window border corners. The radius is clamped per window so that the square
# content corners stay inside the arc: a border 3px wide caps it at 11, 4px at
# 15 and 6px at 22, so raise the border width to get a larger radius.
border_radius = 10
